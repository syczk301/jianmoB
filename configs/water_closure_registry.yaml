version: 1
primary: W1
W0: vapor_and_bound_transport_plus_freezing_without_liquid_transport
W1:
  pressure_definition: "p_l-p_g = -sigma*cos(theta)*sqrt(epsilon0/K)*(1.417*s-2.120*s^2+1.263*s^3)"
  saturation: "s=theta_l/(epsilon0-theta_i)"
  pressure_source: "https://pmc.ncbi.nlm.nih.gov/articles/PMC10096711/ equation 18"
  corroborating_source: "https://www.sciencedirect.com/science/article/pii/S0360319911002746"
  relative_permeability: "s^3"
  relative_permeability_source: "https://deepblue.lib.umich.edu/bitstream/handle/2027.42/78800/siegeljb_1.pdf?sequence=1"
  ice_connectivity: "(1-s_i)^3; modeling assumption, exponent 1/3/5 sensitivity"
  dry_face: upstream_relative_mobility_with_harmonic_absolute_permeability
  interface: common_pressure_flux_conservative_saturation_may_jump
  outlet_primary: closed_liquid_flux
  outlet_envelope: "p_l=p_g, outflow only; no supplied experiment confirms breakthrough boundary"
  viscosity:
    source: "https://iapws.org/technical-guidance/release/LiquidWater.download equation 7"
    expression_Pa_s: "1e-6*(280.68*(T/300)^-1.9+511.45*(T/300)^-7.7+61.131*(T/300)^-19.6+0.45903*(T/300)^-40)"
    valid_K: [253.15, 383.15]
    below_253_15_K: "hold at 253.15 K as an explicitly unvalidated envelope; multiplier sensitivity 1,2,5"
  surface_tension:
    source: "https://iapws.org/technical-guidance/release/Surf-H2O.download"
    expression_N_m: "0.2358*(1-T/647.096)^1.256*(1-0.625*(1-T/647.096))"
    supercooling_support_to_K: 248.15
    below_248_15_K: conditional_extrapolation
  applicability: "Leverett family is a continuum approximation; low-temperature catalyst-layer validity is not experimentally established here"
W2:
  enabled: false
  reason: "Optional ice-vapor extension requires a sourced rate; no synthetic sublimation sink is added"
